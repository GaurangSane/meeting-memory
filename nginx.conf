# ==============================================================================
#  nginx.conf — Meeting Memory SaaS  (Phase 11, Step 11.1)
#
#  Topology
#  ────────
#  Internet → nginx (80 / 443) → frontend:3000  (Next.js standalone)
#                              → backend:8000   (FastAPI / uvicorn)
#
#  All /api/* requests are forwarded to the FastAPI backend.
#  All /ws/*  requests are forwarded to the FastAPI WebSocket endpoint.
#  Everything else is forwarded to the Next.js frontend.
#
#  Key design decisions
#  ────────────────────
#  1. proxy_http_version 1.1 + Upgrade/Connection headers on /ws/
#     — Required to upgrade from HTTP/1.1 to WebSocket. nginx defaults to
#     HTTP/1.0 for upstream connections, which doesn't support Upgrade.
#
#  2. proxy_read_timeout 3600s on /ws/
#     — WebSocket connections for a meeting can be open for 30–90 minutes.
#     nginx's default 60s timeout would kill them mid-meeting. 3600s matches
#     the plan's maximum expected meeting length (Step 11.1 comment).
#
#  3. proxy_read_timeout 120s on /api/
#     — MOM generation (Gemini call) can take up to 30–60 seconds. The
#     default 60s is a race condition; 120s gives headroom without being
#     dangerously long for a REST endpoint.
#
#  4. client_max_body_size 0 on /ws/
#     — Binary audio blobs arrive as WebSocket frames, not HTTP request
#     bodies. Setting the limit to 0 (unlimited) prevents nginx from
#     incorrectly applying the body size limit to WS frames.
#
#  5. X-Real-IP + X-Forwarded-For headers on all upstreams
#     — Allows FastAPI and the Next.js server to log real client IPs rather
#     than nginx's IP. Needed for any IP-based rate limiting or audit logging.
#
#  6. Separate upstream blocks
#     — Enables future addition of multiple backend / frontend replicas with
#     zero config change to the server block. Also separates health from
#     routing logic.
#
#  HTTPS / TLS
#  ───────────
#  TLS termination is added here in production. Replace the placeholder
#  certificate paths with real Certbot / Let's Encrypt paths:
#
#      ssl_certificate     /etc/letsencrypt/live/<domain>/fullchain.pem;
#      ssl_certificate_key /etc/letsencrypt/live/<domain>/privkey.pem;
#
#  The HTTP-only block at the bottom redirects all HTTP → HTTPS.
#  Remove both if terminating TLS at the load-balancer level instead.
# ==============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;           # Linux: epoll is most efficient for many connections
    multi_accept on;     # Accept multiple new connections per event
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Access logging ────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log main;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    gzip                on;
    gzip_types          text/plain text/css application/json
                        application/javascript text/xml application/xml
                        application/xml+rss text/javascript;
    gzip_min_length     1024;
    gzip_vary           on;
    server_tokens       off;    # Don't expose nginx version in headers

    # ── Security headers (applied globally) ──────────────────────────────────
    add_header X-Content-Type-Options   "nosniff"       always;
    add_header X-Frame-Options          "SAMEORIGIN"    always;
    add_header X-XSS-Protection        "1; mode=block" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # ── Upstream blocks ───────────────────────────────────────────────────────
    # Service names match docker-compose.yml service names.
    # Add more backend/frontend servers here for horizontal scaling.

    upstream backend_upstream {
        server backend:8000;
        keepalive 32;   # Maintain persistent connections to uvicorn workers
    }

    upstream frontend_upstream {
        server frontend:3000;
        keepalive 32;
    }

    # ── Rate limiting ─────────────────────────────────────────────────────────
    # Protects the STT-heavy WebSocket and Gemini-backed MOM API endpoints.
    # Shared memory zone: 10m ≈ 160,000 IP states.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=ws_limit:10m  rate=5r/s;

    # ── HTTP server (local development — no TLS) ──────────────────────────────
    # For production, replace this block with an HTTPS server (listen 443 ssl)
    # and add the corresponding ssl_certificate / ssl_certificate_key directives.
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        client_max_body_size 25M;   # Allow reasonably large API request bodies

        # ── WebSocket: audio streaming endpoint ───────────────────────────────
        #
        # CRITICAL (Step 11.1): These three headers are REQUIRED for the
        # HTTP → WebSocket upgrade to succeed. Without them, nginx will
        # forward the connection as plain HTTP/1.0 and the browser will
        # receive a 400 Bad Request.
        #
        # proxy_read_timeout 3600s: WebSocket connections are long-lived
        # (entire meeting duration). nginx's default 60s would terminate
        # active recording sessions after 1 minute of server-side silence
        # (e.g. a pause between VAD-filtered chunks).
        location /ws/ {
            proxy_pass         http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_read_timeout 3600s;

            # Pass real client IP for audit logging
            proxy_set_header X-Real-IP        $remote_addr;
            proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # No body size limit for WebSocket frames
            client_max_body_size 0;

            # Mild rate limiting on WS connections (5 new conn/s per IP)
            limit_req zone=ws_limit burst=10 nodelay;
        }

        # ── REST API: FastAPI backend ─────────────────────────────────────────
        #
        # proxy_read_timeout 120s: The MOM generation endpoint calls Gemini
        # (which can take 20–60 seconds). The default 60s is a race condition
        # that would return a 504 just as the Gemini call completes.
        location /api/ {
            proxy_pass         http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;

            # Prevent connection header from being passed to upstream
            proxy_set_header Connection "";

            # Rate limiting: 30 req/s per IP, burst of 60, nodelay avoids
            # queuing short bursts (better for interactive API calls)
            limit_req zone=api_limit burst=60 nodelay;
        }

        # ── Frontend: Next.js standalone ─────────────────────────────────────
        location / {
            proxy_pass         http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;

            # Next.js HMR uses a WebSocket in development — keep the upgrade
            # header for it (no-op in production but harmless)
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";

            # Prevent connection header from being passed to upstream
            # (only set it when Upgrade is non-empty)
            # Note: the Connection "upgrade" above overrides this for HMR.
        }

        # ── Static assets: Next.js _next/static/ ─────────────────────────────
        # Long cache TTL for hashed assets (content-addressed by Next.js)
        location /_next/static/ {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;     # Don't log individual static asset requests
        }

        # ── Health check endpoint (used by docker-compose healthcheck) ────────
        location /health {
            proxy_pass         http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            access_log off;
        }
    }
}
